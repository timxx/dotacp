name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore dotacp.sln /p:EnableCiTargetFrameworks=false

      - name: Build
        run: dotnet build dotacp.sln -c Release --no-restore /p:EnableCiTargetFrameworks=false

      - name: Test with Coverage
        run: dotnet test unittest/unittest.csproj -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./TestResults
          fail_ci_if_error: false
