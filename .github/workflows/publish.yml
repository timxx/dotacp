name: Publish

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  publish_nuget:
    runs-on: windows-latest
    if: ${{ github.ref_type == 'tag' }}
    env:
      PACKAGE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore dotacp.sln /p:EnableCiTargetFrameworks=true

      - name: Pack projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:PACKAGE_VERSION.TrimStart('v')
          $projects = @(
            "client/client.csproj",
            "protocol/protocol.csproj"
          )

          foreach ($project in $projects) {
            dotnet pack $project -c Release --no-restore -o artifacts /p:EnableCiTargetFrameworks=true /p:PackageVersion=$version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish to NuGet
        run: dotnet nuget push artifacts\*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
